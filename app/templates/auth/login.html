<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EcoDrive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #1b4332; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,.25); width: 100%; max-width: 400px; padding: 2.5rem 2rem; }
        .brand-icon { width: 64px; height: 64px; background: #d8f3dc; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #2d6a4f; }
        .form-control:focus { border-color: #40916c; box-shadow: 0 0 0 .2rem rgba(64,145,108,.2); }
        .btn-eco { background: #2d6a4f; color: #fff; border: none; }
        .btn-eco:hover { background: #1b4332; color: #fff; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3"><i class="bi bi-car-front-fill"></i></div>
        <h4 class="fw-bold mb-0">EcoDrive</h4>
        <p class="text-muted small">Sistema de Gestão</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 small border-0 rounded-3">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
            <label class="form-label fw-semibold small">E-mail</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" name="email" class="form-control border-start-0 ps-0"
                       placeholder="seu@email.com" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold small">Senha</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="senha" class="form-control border-start-0 ps-0"
                       placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-eco w-100 fw-semibold py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="{{ url_for('auth.recuperar_senha') }}" class="text-muted small text-decoration-none">
            Esqueci minha senha
        </a>
    </div>

    <hr class="my-3">
    <div class="bg-light rounded-3 p-2 text-center">
        <div class="text-muted small fw-semibold">Credenciais de demonstração</div>
        <div class="small mt-1"><code>admin@ecodrive.com</code> / <code>admin123</code></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
