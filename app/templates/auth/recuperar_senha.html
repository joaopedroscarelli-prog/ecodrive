<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha — EcoDrive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #1b4332; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,.25); max-width: 400px; width: 100%; }
        .form-control:focus { border-color: #40916c; box-shadow: 0 0 0 .2rem rgba(64,145,108,.2); }
        .btn-eco { background: #2d6a4f; color: #fff; border: none; }
        .btn-eco:hover { background: #1b4332; color: #fff; }
    </style>
</head>
<body>
<div class="card p-4">
    <h5 class="fw-bold mb-1"><i class="bi bi-key-fill text-success me-2"></i>Recuperar Senha</h5>
    <p class="text-muted small mb-3">Informe seu e-mail para receber as instruções.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 small border-0">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold small">E-mail cadastrado</label>
            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
        </div>
        <button type="submit" class="btn btn-eco w-100">Enviar instruções</button>
    </form>
    <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="text-muted small text-decoration-none">
            <i class="bi bi-arrow-left"></i> Voltar ao login
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
